{% extends 'base.html' %}

{% block content %}
<h2>Ваши заказы</h2>
<table class="table">
    <thead>
        <tr>
            <th>Номер заказа</th>
            <th>Дата</th>
            <th>Сумма</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for order in orders %}
        <tr>
            <td>#{{ order.id }}</td>
            <td>{{ order.created_at|date:"d.m.Y H:i" }}</td>
            <td>{{ order.total_price }} руб</td>
            <td>
                <a href="{% url 'order_detail' order.pk %}" class="btn btn-info">Подробнее</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">У вас пока нет заказов</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
